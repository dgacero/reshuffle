name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Run lint
              run: npm run lint
            - name: Check formatting
              run: npm run format:check
            - name: Run tests
              run: npm run test:coverage
